site_name: RPGMTranslate Documentation
site_description: Documentation for RPGMTranslate
site_author: savannstm

repo_url: https://github.com/rpg-maker-translation-tools/rpgmtranslate
site_url: https://rpg-maker-translation-tools.github.io/rpgmtranslate
edit_uri: blob/main/docs/docs
repo_name: rpg-maker-translation-tools/rpgmtranslate

copyright: Licensed under WTFPL.

nav:
    - Overview: index.md
    - Getting Started: getting-started.md
    - Advanced Features:
          - Translation Table: translation-table.md
          - Search, Replace, Put: search.md
          - Batch Processing: batch-processing.md
          - Glossary: glossary.md
          - Translations Menu: translations-menu.md
          - Settings: settings.md
          - Read Menu: read.md
          - Purge Menu: purge.md
          - Write Menu: write.md
    - Development: development.md

theme:
    name: material

    features:
        - content.action.edit
        - content.action.view
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.expand
        - navigation.path
        - navigation.top

    palette:
        scheme: slate
        primary: indigo
        accent: indigo

    locale: en
    language: en

    logo: assets/icon.png
    favicon: assets/icon.png

plugins:
    - i18n:
          docs_structure: folder
          languages:
              - locale: en
                default: true
                name: English
                build: true

              - locale: ru
                name: Русский
                build: true
                nav_translations:
                    Overview: Обзор
                    Getting Started: Поехали
                    Advanced Features: Продвинутые функции
                    Translation Table: Таблица перевода
                    Search, Replace, Put: Поиск
                    Batch Processing: Инструменты обработки
                    Glossary: Глоссарий
                    Translations Menu: Меню переводов
                    Settings: Настройки
                    Read Menu: Меню чтения
                    Purge Menu: Меню очистки
                    Write Menu: Меню записи
                    Development: Разработка
                site_name: "Документация для RPGMTranslate"
                site_description: "Документация для RPGMTranslate"
